<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Party Game - Controller</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;900&display=swap" rel="stylesheet">
</head>
<body class="player-body">

  <!-- Login Giocatore -->
  <div id="login-view" class="player-container">
    <h1 class="glow-text">ENTRA IN GIOCO</h1>
    <p class="subtitle">Inserisci il tuo nome per partecipare</p>
    <div class="input-group">
      <input type="text" id="player-name" placeholder="Il tuo nome..." maxlength="15" />
      <button class="btn btn-primary" onclick="joinGame()">ENTRA 🎮</button>
    </div>
  </div>

  <!-- Area Buzzer / Controller -->
  <div id="game-view" class="player-container hidden">
    <div class="player-header">
      <span id="display-name" class="badge">---</span>
      <span id="player-score" class="score-badge">0 PT</span>
    </div>

    <div class="buzzer-wrapper">
      <button id="buzzer-btn" class="buzzer-btn" onclick="hitBuzzer()">
        <span>PRENOTA!</span>
      </button>
    </div>

    <p id="buzzer-status" class="status-msg">Guarda lo schermo principale...</p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="player.js"></script>
</body>
</html>
